[project]
name = "genesis-tip"
version = "0.1.0"
description = "Temporal Integrity Probe — behavioural consistency testing for LLM agents under temporal context manipulation (GenesisAeon P50)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Johann Römer", email = "joberoemer@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "GenesisAeon", "P50", "TIP", "temporal-integrity",
    "LLM-evaluation", "consistency", "behavioral-testing",
    "open-science",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.13",
    "diamond-setup>=2.2.0",
]

[project.optional-dependencies]
scope = [
    "scope-resilience>=1.0.0",
]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/GenesisAeon/genesis-tip"
Repository = "https://github.com/GenesisAeon/genesis-tip"
Issues = "https://github.com/GenesisAeon/genesis-tip/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genesis_tip"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # allow assert in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=genesis_tip --cov-report=term-missing -v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
